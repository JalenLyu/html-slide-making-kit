<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Annotated Screenshot Template</title>
    <link rel="stylesheet" href="./shopee-slide-kit.css" />
  </head>
  <body>
    <main class="deck">
      <section class="slide active">
        <div class="slide-inner">
          <header class="slide-header">
            <h1 class="title"><span>[Section]</span><b>|</b> [Key message about this screen]</h1>
          </header>
          <div class="content grid-2">
            <figure class="screen-frame">
              <img src="../assets/screenshots/[source-image].png" alt="[screen description]" />
              <span class="screen-marker" style="left:40px;top:80px;">1</span>
              <span class="screen-marker" style="right:40px;top:220px;">2</span>
              <span class="screen-marker" style="right:40px;bottom:80px;">3</span>
            </figure>
            <aside class="panel panel-pad">
              <span class="section-label">Use this screen for</span>
              <ul class="bullet-list">
                <li>[Audience action]</li>
                <li>[PRD rule]</li>
                <li>[Important boundary]</li>
              </ul>
            </aside>
          </div>
        </div>
        <div class="footer">Private &amp; Confidential</div>
        <div class="page-num">N</div>
      </section>
    </main>
  </body>
</html>
