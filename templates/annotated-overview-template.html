<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Annotated Overview Template</title>
    <link rel="stylesheet" href="./shopee-slide-kit.css" />
  </head>
  <body>
    <main class="deck">
      <section class="slide active">
        <div class="slide-inner">
          <header class="slide-header">
            <h1 class="title"><span>[Section]</span><b>|</b> [Key message: describe the full configuration loop]</h1>
          </header>
          <section class="purpose-band">[One sentence on audience, action, and outcome.]</section>
          <div class="content">
            <div class="workflow">
              <article class="step-card"><span class="step-index">1</span><h3>[Step]</h3><p>[Action + purpose]</p></article>
              <article class="step-card"><span class="step-index">2</span><h3>[Step]</h3><p>[Action + purpose]</p></article>
              <article class="step-card"><span class="step-index">3</span><h3>[Step]</h3><p>[Action + purpose]</p></article>
              <article class="step-card"><span class="step-index">4</span><h3>[Step]</h3><p>[Action + purpose]</p></article>
              <article class="step-card"><span class="step-index">5</span><h3>[Step]</h3><p>[Action + purpose]</p></article>
            </div>
          </div>
        </div>
        <div class="footer">Private &amp; Confidential</div>
        <div class="page-num">1</div>
      </section>
    </main>
  </body>
</html>
